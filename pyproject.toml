[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-lock"
version = "0.2.0"
description = "Vendor-neutral hash pinning and per-skill update control for agent skills (SKILL.md bundles)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-agents", "skills", "lockfile", "supply-chain", "integrity", "skill.md"]

[project.scripts]
skilllock = "skilllock.cli:main"

[tool.setuptools]
packages = ["skilllock"]
